<html lang="en">

<title>BOC ReRT EQD2</title>
<style>
/* Mobile-first wizard. Fully offline: no external fonts, scripts or images. */
:root{
  --bg:#faf7ef; --card:#ffffff; --ink:#1f1c15; --muted:#6e6655; --line:#e2d8c0;
  --gold:#a8842c; --gold-ink:#ffffff; --gold-soft:#f4ecd6; --slot:#fbf0d2; --calc:#f3efe4;
  --ok:#2f7a4a; --ok-bg:#e3f1e7; --warn:#946400; --warn-bg:#fbefd2; --bad:#a3282b; --bad-bg:#f8e1e1;
  --c1:#b9a46e; --c2:#5b6f8f;
  --serif:"Times New Roman",Times,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14120d; --card:#1e1b14; --ink:#efe9da; --muted:#a79e88; --line:#3a3424;
  --gold:#d4ae57; --gold-ink:#1a160c; --gold-soft:#2b2516; --slot:#2f2814; --calc:#25211a;
  --ok:#83d19c; --ok-bg:#1b3223; --warn:#e9bf5f; --warn-bg:#372b10; --bad:#f28e90; --bad-bg:#3a1a1b;
  --c1:#9d8b59; --c2:#8098bb; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px double var(--gold);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand b{font-family:var(--serif);font-size:19px}
.brand span{font-size:12px;color:var(--muted);text-align:right}
.steps{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13.5px;font-family:var(--sans);cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.chip.done:not(.on){color:var(--ink);border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
h2{font-family:var(--serif);font-size:22px;margin:4px 0 0}
.lead{color:var(--muted);font-size:14.5px;margin:-4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.card.slot{background:var(--slot);border-color:var(--gold)}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.row.two{grid-template-columns:1fr 1fr}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input.big{font-size:20px;font-weight:700;text-align:center;padding:10px 6px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--gold);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.switch{position:relative;width:50px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--gold)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.organ{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:10px;background:var(--card)}
.organ.off{opacity:.55}
.organ .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.organ .name{font-weight:700;font-size:15.5px}
.organ .meta{font-size:12.5px;color:var(--muted)}
.res{font-variant-numeric:tabular-nums;background:var(--calc);border-radius:8px;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.res b{font-size:17px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--gold);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:52px}
.quick button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}
.interval{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.interval b{font-size:28px;color:var(--gold);font-family:var(--serif)}
.alert{border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.warn{background:var(--warn-bg);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;font-size:24px;font-family:var(--serif)}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.rc{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--card)}
.rc.ok{border-left-color:var(--ok)} .rc.warn{border-left-color:var(--warn)} .rc.bad{border-left-color:var(--bad)}
.rc .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--calc);color:var(--muted)}
.track{position:relative;height:14px;background:var(--calc);border-radius:7px;display:flex;overflow:visible}
.track i{display:block;height:100%} .track i:first-child{border-radius:7px 0 0 7px}
.track .a{background:var(--c1)} .track .b{background:var(--c2)}
.track .lim{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad);border-radius:2px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{display:block;color:var(--ink);font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--gold);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
.btn:focus-visible,.chip:focus-visible,.quick button:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.nav .btn{flex:1;max-width:340px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.x{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9}
.iosHint{max-width:720px;margin:12px auto 0;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin-inline:16px}
@media (min-width:752px){.iosHint{margin-inline:auto}}
.iosHint button{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.credit{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.credit .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 8px}
[hidden]{display:none!important}
@media print{
  .top .steps,.nav,.actions,.toast,.noprint{display:none!important}
  .top{position:static} main{padding:0} body{background:#fff}
  .rc,.card{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <div class="quick" role="group" aria-label="Dose entered as"><button type="button" data-mode="${c}${k}" data-v="total" class="${C[k + "m"] !== "fx" ? "on" : ""}">Total</button><button type="button" data-mode="${c}${k}" data-v="fx" class="${C[k + "m"] === "fx" ? "on" : ""}">Per fx</button></div></div>`).join("")}
  </div><p class="note">Choose whether each dose below is the total or the dose per fraction. HDR brachytherapy is usually entered per fraction (e.g. 7 Gy × 4 fx = 28 Gy total).</p></div>
  ${active().map(([o, i]) => { const e = course(o, c); return `<div class="organ">
    <div class="head"><span class="name">${esc(o.n)}</span><span class="meta">${esc(o.m)} · α/β ${esc(o.ab)}</span></div>
    <div class="row two"><label class="f">${esc(site.comp1)} ${C.am === "fx" ? "dose per fx" : "total dose"} (Gy)<input class="big" data-o="${i}" data-f="a${c}" value="${esc(o["a"+c])}" inputmode="decimal" placeholder="–"></label>
    ${S.boost ? `<label class="f">${esc(site.comp2)} ${C.bm === "fx" ? "dose per fx" : "total dose"} (Gy)<input class="big" data-o="${i}" data-f="b${c}" value="${esc(o["b"+c])}" inputmode="decimal" placeholder="–"></label>` : ""}</div>
    <p class="note" data-live="bd${c}-${i}">${breakdown(o, c)}</p>
    <div class="res"><span>EQD2${c===1?"₁":"₂"}</span><b data-live="e${c}-${i}">${f1(e)} Gy</b></div>${c === 2 ? `<p class="note" data-live="rem2-${i}">${remLine(o)}</p>` : ""}</div>`; }).join("")}
  <div class="alert warn" id="hiFx" ${hiFx() ? "" : "hidden"}>A dose per fraction above 8 Gy is entered. The LQ/EQD2 model is less reliable at SRS/SBRT doses; interpret with caution.</div>`;
}
function vRecovery(){
  const m = months(), any = active().some(([o]) => numv(o.r) > 0), p = proto();
  return `<h2>Recovery after Course 1</h2><p class="lead">Credit for tissue recovery between courses. Protocol: ${esc(p.label)}.</p>
  <div class="card slot"><div class="interval"><span>Interval</span><b>${Number.isFinite(m) ? m.toFixed(1) + " months" : "–"}</b></div>
    ${!Number.isFinite(m) ? `<div class="alert warn">Enter both dates in Setup to see the interval.</div>` : m < 0 ? `<div class="alert bad">Course 2 starts before Course 1 ends. Check the dates.</div>` : m < 6 ? `<div class="alert warn">Under 6 months: recovery credit is normally not applied.</div>` : ""}
    <div class="alert bad" id="recWarn" ${Number.isFinite(m) && m < 6 && any ? "" : "hidden"}>Recovery credit entered with an interval under 6 months. Justify it or set it to 0 %.</div>
    <div class="alert bad" id="dblWarn" ${doubleCount() ? "" : "hidden"}>This protocol's limits apply to the full Course 1 dose (any recovery is already allowed for in the limit). Adding recovery here loosens them beyond the source. Set recovery to 0 % or switch to BOC local.</div>
    <p class="note"><b>UK SABR Consortium 2025 rule:</b> 0 % under 6 months, 30 % for 6–18 months, 50 % over 18 months.${Number.isFinite(m) ? ` For this interval: <b>${ukRule(m)} %</b>.` : ""}</p>
    <button type="button" class="btn" data-act="ukAll">Apply UK rule to all organs</button>
  </div>
  ${active().map(([o, i]) => { const R = calcOrgan(o), ev = recEvidence(o.n); return `<div class="organ">
    <div class="head"><span class="name">${esc(o.n)}</span><span class="meta">EQD2₁ ${f1(R.e1)} Gy</span></div>
    ${ev ? `<p class="note">${esc(ev.text)}</p>` : ""}
    <div class="quick" role="group" aria-label="Recovery for ${esc(o.n)}">${[0,25,30,50].map(q => `<button type="button" data-rq="${i}" data-p="${q}" class="${numv(o.r)===q?"on":""}">${q} %</button>`).join("")}
      <input data-o="${i}" data-f="r" value="${esc(o.r)}" inputmode="decimal" style="width:84px" aria-label="Recovery percent"></div>
    <input data-o="${i}" data-f="basis" value="${esc(o.basis)}" placeholder="Basis or reference for this assumption">
    <div class="res"><span>Residual EQD2₁</span><b data-live="res-${i}">${f1(R.res)} Gy</b></div></div>`; }).join("")}`;
}
function vResults(){
  const list = active().map(([o]) => [o, calcOrgan(o)]).filter(([, R]) => Number.isFinite(R.cum));
  const cnt = k => list.filter(([, R]) => R.st === k).length;
  const max = Math.max(1, ...list.map(([, R]) => Math.max(R.nom, R.lim > 0 ? R.lim : 0))) * 1.05;
  const m = months(), p = proto();
  const crs = c => { const C = S["c"+c]; return `Course ${c}: ${esc(C.tps || "planning system not recorded")} · ${esc(C.meth || "data method not recorded")}${C.reg ? " · " + esc(C.reg) : ""}`; };
  return `<h2>Results</h2><p class="lead">${esc(S.name || "Patient")}${S.mrn ? " · " + esc(S.mrn) : ""} · ${esc(CFG[S.site].title)} · interval ${Number.isFinite(m) ? m.toFixed(1) + " months" : "–"}</p>
  <div class="card"><h3>Protocol <small>${p.refs.map(refShort).join("; ") || "local"}</small></h3><p class="note" style="color:var(--ink)">${esc(p.label)}</p>
    <p class="note">${crs(1)}<br>${crs(2)}</p>
    ${hiFx() ? `<div class="alert warn">Dose per fraction above 8 Gy entered: EQD2 is less reliable at SRS/SBRT doses.</div>` : ""}
    ${doubleCount() ? `<div class="alert bad">Recovery entered although this protocol's limits apply to the full Course 1 dose.</div>` : ""}</div>
  <div class="summary"><div class="tile ok"><b>${cnt("ok")}</b><span>Within</span></div><div class="tile warn"><b>${cnt("warn")}</b><span>Caution</span></div><div class="tile bad"><b>${cnt("bad")}</b><span>Exceeds</span></div></div>
  ${list.length ? "" : `<div class="card"><b>No results yet.</b><p class="note">Enter fractions and doses in Course 1 and Course 2.</p></div>`}
  ${list.sort((a, b) => (numv(b[1].pct) || 0) - (numv(a[1].pct) || 0)).map(([o, R]) => `<div class="rc ${R.st}">
    <div class="head"><b>${esc(o.n)}</b><span class="pill ${R.st}">${R.lab}${Number.isFinite(R.pct) ? " · " + R.pct.toFixed(0) + " %" : ""}</span></div>
    <div class="track" role="img" aria-label="${esc(o.n)} cumulative ${f1(R.cum)} Gy"><i class="a" style="width:${R.res / max * 100}%"></i><i class="b" style="width:${R.e2 / max * 100}%"></i>${R.lim > 0 ? `<span class="lim" style="left:${R.lim / max * 100}%"></span>` : ""}</div>
    <div class="nums"><span>EQD2₁<b>${f1(R.e1)}</b></span><span>After ${R.r} %<b>${f1(R.res)}</b></span><span>EQD2₂<b>${f1(R.e2)}</b></span><span>Cumulative<b>${f1(R.cum)}</b></span></div>
    <div class="meta" style="font-size:12.5px">Course 2 allowance: ${remLine(o)}</div>
    <div class="meta" style="font-size:12.5px;color:var(--muted)">Without recovery ${f1(R.nom)} Gy · limit ${R.lim > 0 ? f1(R.lim) + " Gy" : "none"} · ${esc(o.m)}, α/β ${esc(o.ab)}${o.note ? " · " + esc(o.note) : ""}</div></div>`).join("")}
  <div class="legend"><span><i style="background:var(--c1)"></i>Course 1 after recovery</span><span><i style="background:var(--c2)"></i>Course 2</span><span><i style="background:var(--bad);width:3px"></i>Limit</span></div>
  <div class="actions noprint"><button type="button" class="btn primary" data-act="copy">Copy summary</button><button type="button" class="btn" data-act="print">Print / PDF</button></div>
  <p class="note">EQD2 = D × (D/n + α/β) / (2 + α/β), summed over components. Cumulative = EQD2₁ × (1 − recovery) + EQD2₂. Status: within ≤ 90 %, caution 90–100 %, exceeds &gt; 100 % of limit. Results support, and do not replace, clinical and physics review.</p>
  <p class="foot">${CREDIT}<br>RMS.BOC.RON.PHY.0__ · Rev. 01 · Oct 2026</p>`;
}
function vEvidence(){
  const site = P.sites[S.site], used = new Set(["ESTRO22","ESTRO23","ASTRO24"].concat(S.site === "CNS" ? ["EANO25"] : []));
  site.protocols.forEach(p => p.refs.forEach(r => used.add(r)));
  const cell = (v) => v.limS == null ? `<span style="color:var(--muted)">–</span>` : `${v.limS}${v.limL != null ? ` → ${v.limL} <small>(≥${v.cut} mo)</small>` : ""}<br><small>${esc(v.m)} · α/β ${v.ab}</small>`;
  const prots = site.protocols.filter(p => p.id !== "BOC");
  return `<h2>Evidence</h2><p class="lead">${SITENAME[S.site]}: cumulative EQD2 limits (Gy) by protocol, recovery evidence, and references.</p>
  <div class="card"><h3>What the major bodies say</h3>
    <p class="note" style="color:var(--ink)"><b>ESTRO–EORTC (2022):</b> defines Type 1 / Type 2 re-irradiation and reporting; sum doses as EQD2/BED with relevant α/β; record the source and method of the previous dose; if the previous plan is unavailable, assume the prescription dose reached the OAR. It gives <b>no organ-specific cumulative limits</b>. Survey (2023): the most common minimum interval used is 6–12 months.</p>
    <p class="note" style="color:var(--ink)"><b>ASTRO:</b> no re-irradiation guideline for these sites; its 2023 education panel summarised the ESTRO–EORTC consensus. The US society guidance used here is the <b>American Radium Society</b> AUC (H&N).</p>
    ${S.site === "CNS" ? `<p class="note" style="color:var(--ink)"><b>ESTRO/EANO (2025), glioblastoma:</b> KPS ≥60 and interval &gt;6 months; re-irradiation EQD2 no less than 36 Gy (e.g. 35 Gy/10 fx or 27–30 Gy/3–5 fx); sum doses as EQD2 with α/β 3 Gy; recovery only for brain and spinal cord; no consensus for brainstem; optic recovery uncertain. It gives <b>no numerical cumulative limits</b>; the limits here come from the literature it does not replace.</p>` : ""}
    <p class="note" style="color:var(--ink)"><b>UK:</b> UK SABR Consortium pelvic re-irradiation guidance (2025) gives the recovery rule. No UK H&N re-irradiation guideline was found.</p></div>
  <div class="card"><h3>Cumulative limits by protocol</h3><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%">
    <thead><tr><th style="text-align:left;padding:6px;border-bottom:1px solid var(--line)">Organ</th>${prots.map(p => `<th style="text-align:left;padding:6px;border-bottom:1px solid var(--line);min-width:110px">${esc(refShort(p.refs[0]))}${p.id==="NG_D"?" desirable":p.id==="NG_A"?" acceptable":""}</th>`).join("")}</tr></thead>
    <tbody>${site.organs.map((n, i) => `<tr><td style="padding:6px;border-bottom:1px solid var(--line);font-weight:600">${esc(n)}</td>${prots.map(p => `<td style="padding:6px;border-bottom:1px solid var(--line);vertical-align:top">${cell(p.organs[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="note">“→” = higher limit used once the interval reaches the stated months. “–” = no value in that source.</p></div>
  <div class="card"><h3>Recovery evidence by organ</h3>${site.recovery.map(r => `<div><b>${esc(r.organ)}</b><p class="note">${esc(r.text)}${r.refs.length ? ` [${r.refs.map(refShort).join("; ")}]` : ""}</p></div>`).join("")}</div>
  <div class="card"><h3>References</h3>${[...used].map(k => `<p class="note"><b>${esc(refShort(k))}:</b> ${esc(P.refs[k])}</p>`).join("")}</div>
  <p class="foot">${CREDIT}</p>`;
}

/* ---------- render & events ---------- */
function render(){
  $("steps").innerHTML = STEPS.map((s, i) => `<button type="button" class="chip ${i===S.step?"on":""} ${i<S.step?"done":""}" data-step="${i}">${i+1}. ${s}</button>`).join("");
  $("main").innerHTML = [vSetup, () => vCourse(1), vRecovery, () => vCourse(2), vResults, vEvidence][S.step]();
  $("backBtn").style.visibility = S.step === 0 ? "hidden" : "visible";
  $("nextBtn").textContent = S.step === STEPS.length - 1 ? "Back to setup" : "Next: " + STEPS[S.step + 1];
  const on = $("steps").querySelector(".on"); if (on && on.scrollIntoView) try { on.scrollIntoView({ inline: "center", block: "nearest" }); } catch (_) {}
  save();
}
function go(n){ S.step = Math.max(0, Math.min(STEPS.length - 1, n)); render(); try { window.scrollTo(0, 0); } catch (_) {} }
function live(){
  active().forEach(([o, i]) => { const R = calcOrgan(o);
    const set = (k, v) => { const el = document.querySelector(`[data-live="${k}"]`); if (el) el.textContent = f1(v) + " Gy"; };
    set(`e1-${i}`, R.e1); set(`e2-${i}`, R.e2); set(`res-${i}`, R.res);
    document.querySelectorAll(`[data-live="rem-${i}"],[data-live="rem2-${i}"]`).forEach(el => el.innerHTML = remLine(o));
    [1, 2].forEach(c => { const el = document.querySelector(`[data-live="bd${c}-${i}"]`); if (el) el.innerHTML = breakdown(o, c); }); });
  const hf = $("hiFx"); if (hf) hf.hidden = !hiFx();
  const w = $("recWarn"); if (w){ const m = months(); w.hidden = !(Number.isFinite(m) && m < 6 && active().some(([o]) => numv(o.r) > 0)); }
  const d = $("dblWarn"); if (d) d.hidden = !doubleCount();
  document.querySelectorAll("[data-rq]").forEach(b => b.classList.toggle("on", numv(S.organs[b.dataset.rq].r) === numv(b.dataset.p)));
  save();
}
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.k === "protoSel") return;
  if (d.k){ S[d.k] = t.type === "checkbox" ? t.checked : t.value; if (d.k === "boost") render(); else live(); return; }
  if (d.c){ S["c" + d.c][d.f] = t.value; if (d.f === "meth") render(); else live(); return; }
  if (d.o !== undefined){ const o = S.organs[+d.o];
    if (d.f === "limS"){ o.limS = t.value; o.limL = null; o.cut = null; o.note = "Edited locally"; }
    else o[d.f] = t.type === "checkbox" ? t.checked : t.value;
    if (d.f === "on") t.closest(".organ").classList.toggle("off", !t.checked); live(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k === "protoSel"){ applyProto(t.value); render(); toast("Protocol applied: limits, α/β, metrics and recovery updated"); return; }
  if (t.type === "date"){ if (proto().rec === "uk") applyProto(S.proto); render(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.step) return go(+d.step);
  if (d.site){ if (d.site !== S.site){ freshState(d.site); render(); toast(SITENAME[d.site] + " organ list loaded"); } return; }
  if (d.mode){ const c = d.mode[0], k = d.mode[1]; S["c" + c][k + "m"] = d.v; render(); toast(d.v === "fx" ? "Doses now read as dose per fraction" : "Doses now read as total dose"); return; }
  if (d.rq !== undefined){ S.organs[+d.rq].r = +d.p; const inp = document.querySelector(`[data-o="${d.rq}"][data-f="r"]`); if (inp) inp.value = d.p; live(); return; }
  const act = d.act;
  if (act === "ukAll"){ const q = ukRule(months()); active().forEach(([o]) => { o.r = q; o.basis = `UK SABR 2025 rule (${q}% for ${f1(months())} mo)`; }); render(); toast(`UK rule applied: ${q} %`); }
  if (act === "addOrgan"){ S.organs.push(blankOrgan("")); render(); const ins = document.querySelectorAll('[data-f="n"]'); ins[ins.length - 1].focus(); }
  if (act === "example"){ exampleState(S.site); render(); toast("Example case loaded"); }
  if (act === "new"){ $("newConfirm").hidden = false; $("newConfirm").scrollIntoView({ block: "center" }); }
  if (act === "newNo") $("newConfirm").hidden = true;
  if (act === "newYes"){ freshState(S.site); render(); toast("New patient"); }
  if (act === "copy") copySummary();
  if (act === "print") window.print();
});
$("backBtn").onclick = () => go(S.step - 1);
$("nextBtn").onclick = () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1);

function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
function copySummary(){
  const m = months(), site = CFG[S.site], p = proto();
  const crs = c => { const C = S["c"+c]; return `Course ${c}: TPS ${C.tps || "–"}; dose data ${C.meth || "–"}${C.reg ? "; software " + C.reg : ""}; fractions ${site.comp1} ${C.na || "–"}${S.boost ? `, ${site.comp2} ${C.nb || "–"}` : ""}; doses entered as ${C.am === "fx" ? "per fx" : "total"}${S.boost ? ` / ${C.bm === "fx" ? "per fx" : "total"}` : ""}`; };
  let s = `BOC ${site.title.toUpperCase()} – CUMULATIVE EQD2\n${CREDIT}\nPatient: ${S.name} | MRN: ${S.mrn}\nCourse 1 ended ${S.c1end || "–"}; Course 2 starts ${S.c2start || "–"}; interval ${Number.isFinite(m) ? m.toFixed(1) + " months" : "–"}\n`;
  s += `Protocol: ${p.label}${p.refs.length ? " [" + p.refs.map(k => P.refs[k]).join(" | ") + "]" : ""}\n${crs(1)}\n${crs(2)}\n\n`;
  active().forEach(([o]) => { const R = calcOrgan(o); if (!Number.isFinite(R.cum)) return;
    s += `${o.n} [${o.m}, α/β ${o.ab}]: EQD2₁ ${f1(R.e1)} → ${f1(R.res)} Gy after ${R.r}% recovery${o.basis ? " (" + o.basis + ")" : ""}; EQD2₂ ${f1(R.e2)} Gy; cumulative ${f1(R.cum)} Gy (no recovery ${f1(R.nom)}); limit ${R.lim > 0 ? f1(R.lim) + " Gy" : "–"}${o.note ? " (" + o.note + ")" : ""} – ${R.lab}${Number.isFinite(R.pct) ? " " + R.pct.toFixed(0) + "%" : ""}; Course 2 allowance: ${remLine(o).replace(/<[^>]+>/g, "")}\n`; });
  if (doubleCount()) s += "\nWARNING: recovery entered although this protocol's limits apply to the full Course 1 dose.\n";
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = s; ta.rows = 10; ta.className = "noprint"; $("main").appendChild(ta); ta.focus(); ta.select(); toast("Selected below. Copy it from there."); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(() => toast("Summary copied"), fallback); else fallback();
}
render();
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  let dismissed=false; try{dismissed=localStorage.getItem("boc-ios-hint")==="1";}catch(_){}
  if(ios&&!standalone&&!dismissed) $("iosHint").hidden=false;
  $("iosHintX").onclick=()=>{$("iosHint").hidden=true;try{localStorage.setItem("boc-ios-hint","1");}catch(_){}};
})();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
